server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required for runtime hostname resolution so nginx
    # doesn't crash at startup if the backend container is not up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional same-origin proxy to the backend. The frontend can also point
    # straight at any absolute URL via its in-app Settings — in that case this
    # block is simply unused.
    #
    # The `set $upstream` + variable in `proxy_pass` forces nginx to resolve
    # the hostname per-request via the resolver above, instead of at startup.
    # If the backend is down we serve a 502, but nginx itself keeps running
    # and the SPA stays reachable.
    location /api {
        set $upstream "http://api-papi:8080";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_intercept_errors off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
